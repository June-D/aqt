market:
  timezone: Asia/Shanghai
  sessions:
    - start: "09:30"
      end: "11:30"
    - start: "13:00"
      end: "15:00"

risk:
  max_position_pct: 0.20          # 单票最大仓位
  max_total_position_pct: 0.95    # 总仓位上限
  max_daily_loss_pct: 0.05        # 单日最大亏损熔断
  max_strategy_position_pct: 0.50 # 同源仓位上限（如 intel_llm）
  min_trade_interval_seconds: 60
  lot_size: 100
  whitelist: []                     # 手工补充；默认靠东财热点池（intel.hot_pool）
  blacklist: []                     # 永久排除

fees:
  commission_rate: 0.0003         # 佣金万三
  min_commission: 5.0
  stamp_tax_rate: 0.001           # 卖出印花税千一
  slippage_bps: 5                 # 滑点（基点）

alerts:
  pushplus_token: ""              # PushPlus token；未配置则只落库
  pushplus_topic: ""

market_data:
  provider: ifind                 # ifind | alltick | tushare
  ifind:
    refresh_token: ""
    base_url: "https://quantapi.51ifind.com/api/v1"
  alltick:
    token: ""
    base_url: "https://quote.alltick.co"
  tushare:
    token: ""

intel:
  enabled: false
  poll_interval_seconds: 300        # 交易时段每 5 分钟
  max_news_per_run: 40
  max_age_hours: 48
  min_confidence: 0.7
  max_position_pct: 0.10
  max_buy_cash_pct: 0.15
  trade_pct: 0.1
  max_holdings: 10
  max_new_buys_per_run: 3
  max_per_sector: 3
  max_orders_per_day: 30
  sell_mode: all                    # all | pct
  sell_fraction_on_down: 0.5        # sell_mode=pct 时使用
  allow_auto_sell: true
  reopen_cooldown_minutes: 30
  require_whitelist: true
  news_provider: appbuilder
  appbuilder:
    enabled: true
    search_source: baidu_search_v2
    search_recency_filter: week
    max_results_per_query: 5
    symbols_per_run: 12
    query_template: "A股 {symbol} 股票 最新消息 热点新闻"
    include_market_pulse: true
    market_query: "A股 今日热点 板块 涨停 政策 新闻"
    timeout_seconds: 45
  tavily:
    enabled: false
    topic: news
    search_depth: basic
    time_range: day
    max_results_per_query: 3
    symbols_per_run: 12
    query_template: "A股 {symbol} 股票 最新消息 热点新闻"
    include_market_pulse: true
    market_query: "A股 今日热点 板块 涨停 政策 新闻"
    timeout_seconds: 45
  hot_pool:
    enabled: true
    mode: merge
    top_n: 80
    include_up_rank: true
    extra_symbols: []
    blacklist: []
    custom_http:
      enabled: false
      url: ""
      headers: {}
      items_path: ""
      symbol_field: "code"
      name_field: "name"
  rss_feeds:
    - name: sina_finance
      url: "https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&num=30"
  http_sources:
    - name: eastmoney_finance
      url: "https://np-listapi.eastmoney.com/comm/web/getNewsByColumns?client=web&biz=web_news_col&column=350&order=1&needInteractData=0&page_index=1&page_size=30&req_from=front_news"
      items_path: "data.list"
      title_field: "title"
      summary_field: "digest"
      url_field: "url"
      time_field: "showTime"
